events {}
http {
    # --- Global SSL and Security Settings ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    upstream megadocu {
        server megadocu:80;
    }

    upstream megagoal {
        server megagoal_webapp:80;
    }

    upstream megagoal_server {
        server megagoal_server:3150;
    }

    upstream onze_webapp {
        server 172.31.47.244:81;
    }

    upstream onze_server {
        server 172.31.47.244:3250;
    }

    upstream otto_webapp {
        server 172.31.47.244:80;
    }

    upstream otto_server {
        server 172.31.47.244:3150;
    }

    upstream megagoal_server_mcp {
        server megagoal_server:3151;
    }

    upstream megagoal_stats {
        server 172.31.47.244:8000;
    }

    upstream megagoal_updater {
        server megagoal_updater:8100;
    }

    upstream megaauth {
        server megaauth:80;
    }
    
    upstream megahome {
        server megahome:80;
    }

    upstream megamedia {
        server megamedia_webapp:3000;
    }

    upstream megamedia_server {
        server megamedia_server:8080;
    }

    upstream megalog_webapp {
        server megalog_webapp:80;
    }

    upstream megalog_server {
        server megalog_server:3001;
    }

    server {
        listen 80;
        server_name megagera.com megadocu.megagera.com megagoal.megagera.com server.megagoal.megagera.com mcp.megagoal.megagera.com stats.megagoal.megagera.com updater.megagoal.megagera.com megaauth.megagera.com megamedia.megagera.com server.megamedia.megagera.com megalog.megagera.com server.megalog.megagera.com otto.megagera.com server.otto.megagera.com onze.megagera.com server.onze.megagera.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name megadocu.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            auth_request /validate;
            error_page 401 = @error401;
            
            proxy_pass http://megadocu;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /validate {
            internal;
            proxy_pass http://megaauth/validate/megadocu;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @error401 {
            return 302 https://megaauth.megagera.com/?redirect=$scheme://$host$request_uri;
        }
        
    }

    server {
        listen 443 ssl;
        server_name megagoal.megagera.com;
      
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        # Landing page without authentication
        location / {
            proxy_pass http://megagoal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # App routes with authentication
        location /app {
            auth_request /validate;
            error_page 401 = @error401;
            
            proxy_pass http://megagoal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /validate {
            internal;
            proxy_pass http://megaauth/validate/megagoal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @error401 {
            return 302 https://megaauth.megagera.com/?redirect=$scheme://$host$request_uri;
        }
    }

    # MegaGoal Server API validates its own requests 
    server {
        listen 443 ssl;
        server_name server.megagoal.megagera.com;
      
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            proxy_pass http://megagoal_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name otto.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        # Otto WebApp: multipart image uploads (up to 10 MiB app limit).
        client_max_body_size 12m;

        location / {
            proxy_pass http://otto_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app {
            auth_request /validate;
            error_page 401 = @error401;

            proxy_pass http://otto_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /validate {
            internal;
            proxy_pass http://megaauth/validate/otto;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @error401 {
            return 302 https://megaauth.megagera.com/?redirect=$scheme://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name server.otto.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        # Otto API: multipart image uploads (up to 10 MiB app limit).
        client_max_body_size 12m;

        location / {
            proxy_pass http://otto_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    server {
        listen 443 ssl;
        server_name onze.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        # Onze WebApp

        location / {
            proxy_pass http://onze_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /app {
            auth_request /validate;
            error_page 401 = @error401;

            proxy_pass http://onze_webapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /validate {
            internal;
            proxy_pass http://megaauth/validate/onze;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @error401 {
            return 302 https://megaauth.megagera.com/?redirect=$scheme://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name server.onze.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        # Onze API

        location / {
            proxy_pass http://onze_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # MegaGoal MCP (FastMCP on 3151). Auth is handled by the Node app (MCP_API_KEY + headers), not auth_request.
    server {
        listen 443 ssl;
        server_name mcp.megagoal.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            proxy_pass http://megagoal_server_mcp;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # MegaGoal Stats API validates its own requests 
    server {
        listen 443 ssl;
        server_name stats.megagoal.megagera.com;
      
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            proxy_pass http://megagoal_stats;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # MegaGoal Updater API validates its own requests 
    server {
        listen 443 ssl;
        server_name updater.megagoal.megagera.com;
      
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            proxy_pass http://megagoal_updater;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }

    server { 
        listen 443 ssl;
        server_name megagera.com;
    
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            auth_request /validate;
            error_page 401 = @error401;
            
            proxy_pass http://megahome;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location = /validate {
            internal;
            proxy_pass http://megaauth/validate;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @error401 {
            return 302 https://megaauth.megagera.com/?redirect=$scheme://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name megaauth.megagera.com;

        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            proxy_pass http://megaauth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name megamedia.megagera.com;
      
        ssl_certificate     /etc/nginx/certificates/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificates/privkey.pem;

        location / {
            auth_request /validate;
            error_page 401 = @error401;
            
            proxy_pass http://megamedia;
